<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>SPX SBB Missroute</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/leaflet.css" />
    <link rel="stylesheet" href="css/style.css" />
</head>
<body class="p-2">

    <div class="container-fluid p-0">
        <div class="search-panel mb-2 p-3 bg-white rounded-3 shadow-sm">
            <h6 class="fw-bold text-dark mb-2">📦 SPX SBB Missroute Checker</h6>
            <div class="input-group">
                <input type="text" id="inputSearch" class="form-control form-control-lg" placeholder="Masukkan Kode Paket / Nama Wilayah..." oninput="prosesCari()">
                <button class="btn btn-warning text-white fw-bold" onclick="bersihkanCari()">Clear</button>
            </div>
        </div>

        <div class="map-container mb-2">
            <div id="mapBox"></div>
        </div>

        <div class="card result-panel shadow-sm border-0">
            <div class="card-header bg-dark text-white fw-bold py-2" style="font-size: 0.9rem;">
                📋 Hasil Kecocokan Wilayah Sortir
            </div>
            <div class="list-group list-group-flush" id="listHasil">
                <div class="p-3 text-center text-muted card-info-text">Silakan ketik data paket untuk memulai tracking.</div>
            </div>
        </div>
    </div>

    <script src="cordova.js"></script>
    <script src="js/leaflet.js"></script>
    <script src="js/index.js"></script>
</body>
</html>
